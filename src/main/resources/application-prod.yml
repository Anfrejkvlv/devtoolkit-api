server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  tomcat:
    max-threads: 100
    min-spare-threads: 5
spring:
  task:
    scheduling:
      enabled: true
  # Spring AI -  Config
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile      # Rapide + pas cher pour les outils
          temperature: 0.1        # Réponses précises et déterministes
          max-tokens: 3000
    google.genai:
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: gemini-3-flash-preview      # Rapide + pas cher pour les outils
          temperature: 0.1        # Réponses précises et déterministes
          max-tokens: 3000

gemini:
  models:
    - gemini-3-flash-preview
    - gemini-2.5-flash
    - gemini-2.0-flash
    - gemini-2.5-flash-lite
    - gemini-3.1-pro-preview
    - gemini-2.5-pro
groq:
  models:
    - llama-3.3-70b-versatile
    - llama-3.1-70b-versatile
    - mixtral-8x7b-32768
    - gemma2-9b-it

  # Cache Redis (optionnel en dev, activer en prod)
  data:
    redis:
      ssl:
        enabled: true
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 5000
      connect-timeout: 5000

  cache:
    type: redis
    redis:
      time-to-live: 3600000       # 1 heure en ms

  # CORS pour Angular
  mvc:
    cors:
      allowed-origins: ${FRONTEND_URL}

# Logs production (format JSON pour centralisation)
logging:
  level:
    org.springframework.ai: INFO
    root: INFO
    com.devtoolkit: INFO
    org.springframework: WARN
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%level","thread":"%thread","logger":"%logger","message":"%message"}%n'
  file:
    name: /app/logs/application.log
    max-size: 100MB
    max-history: 30

# Désactiver les fonctionnalités de développement
debug: false
trace: false

# Limites de requêtes (à affiner avec un rate limiter en prod)
devtoolkit:
  ai:
    max-input-length: 5000        # Caractères max envoyés à l'IA
    requests-per-minute: 60       # Par IP (implémenté via filtre)

app:
  api-url: ${API_URL}